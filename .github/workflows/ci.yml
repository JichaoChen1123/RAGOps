name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend development dependencies
        run: uv sync --project backend --extra dev --frozen
      - name: Lint backend, tests, and repository scripts
        run: uv run --project backend ruff check --config backend/pyproject.toml backend/app tests scripts
      - name: Run backend, evaluation, and fixture acceptance gate
        run: >-
          uv run --project backend pytest -c backend/pyproject.toml
          tests/backend tests/evaluation -q
          --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build

  repository-contracts:
    name: Markdown, fixtures, and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install validation dependencies
        run: uv sync --project backend --extra dev --frozen
      - name: Validate repository contracts
        run: uv run --project backend python scripts/validate_repository.py
      - name: Validate WOR-49 visible interaction contract
        shell: pwsh
        run: ./tests/acceptance/validate-wor-49.ps1
      - name: Validate WOR-55 UI and README contract
        shell: pwsh
        run: ./tests/acceptance/validate-wor-55.ps1

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository-contracts]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build MVP images
        run: docker compose build
